# Render Infrastructure as Code (Blueprint) Specification for Pathify AI
# Deploy by connecting repository to Render -> Blueprints
services:
  - type: web
    name: pathify-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic -c database/alembic.ini upgrade head && python scripts/seed_data.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathify-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Pathify AI <onboarding@resend.dev>"

databases:
  - name: pathify-db
    databaseName: pathify_db
    user: pathify_user
    plan: free
